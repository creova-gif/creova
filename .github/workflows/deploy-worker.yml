name: Deploy Intake Worker

# Manual only. A deployment also requires configured Cloudflare secrets, real
# D1 IDs, applied secrets, and an explicit target selection.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - staging
          - production
      confirm:
        description: Type deploy to continue
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package-lock.json
      - name: Install Worker dependencies
        run: npm --prefix workers/api ci
      - name: Verify Worker
        run: npm --prefix workers/api test && npm --prefix workers/api run typecheck
      - name: Refuse placeholder D1 IDs
        run: |
          if grep -q 'REPLACE_WITH_.*_D1_ID' workers/api/wrangler.toml; then
            echo "Replace the staging and production D1 placeholders before deployment."
            exit 1
          fi
      - name: Apply staging migration
        if: github.event.inputs.target == 'staging'
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply creova-intake-staging --remote --env staging
      - name: Deploy staging
        if: github.event.inputs.target == 'staging'
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: Apply production migration
        if: github.event.inputs.target == 'production'
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply creova-intake-production --remote
      - name: Deploy production
        if: github.event.inputs.target == 'production'
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
