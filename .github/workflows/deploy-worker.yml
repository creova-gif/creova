name: Deploy API Worker

# Manual only. Nothing in this workflow runs on push or pull_request.
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not in the repo yet.
# The owner adds them before the first dispatch. Typing anything other than
# "deploy" skips the job.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to publish workers/api. This does not run from CI."
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package-lock.json
      - name: Install worker dependencies
        working-directory: workers/api
        run: npm ci
      - name: Refuse the placeholder D1 database id
        working-directory: workers/api
        run: |
          if grep -q 'database_id = "00000000-0000-0000-0000-000000000000"' wrangler.toml; then
            echo "database_id is still the placeholder. Run wrangler d1 create creova, commit the printed id (it is not a secret), then dispatch again."
            exit 1
          fi
      - name: Apply D1 migrations
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply creova --remote
      - name: Deploy Worker
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
