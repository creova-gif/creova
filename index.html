<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Primary SEO: title/description/OG/Twitter here are a fallback ONLY for
      the brief pre-hydration window and for crawlers that don't execute JS
      (social unfurlers — Slack, Discord, iMessage). Every real route sets
      its own via the PageSEO component (src/components/PageSEO.tsx) once
      React mounts, using react-helmet-async.

      Deliberately NOT included here: robots and canonical. Those need a
      different, correct value per route (e.g. /admin/* is noindex), and
      react-helmet-async does not remove tags that were already in the
      static HTML — it only adds its own, so a static "index, follow" here
      would sit alongside a route's "noindex, nofollow" rather than being
      replaced by it. Omitting them means the only value ever present is
      the one PageSEO renders.
    -->
    <title>CREOVA — Ontario's BIPOC Creative Agency | Photography, Videography & Brand Design</title>
    <meta name="description" content="CREOVA is Ontario's Black-owned BIPOC creative agency offering professional photography, videography, brand management, event design, and social media services. Serving Niagara Region and across Canada." />
    <meta name="keywords" content="BIPOC creative agency, Black-owned agency Ontario, photography Niagara, videography Brock University, brand design Canada, CREOVA" />
    <meta name="author" content="CREOVA" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.creova.one/" />
    <meta property="og:title" content="CREOVA — Ontario's BIPOC Creative Agency" />
    <meta property="og:description" content="Professional photography, videography, brand management, and event design for BIPOC communities across Canada. Based in Niagara Region, Ontario." />
    <meta property="og:image" content="https://www.creova.one/card-blackprint.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="CREOVA" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@creova_ca" />
    <meta name="twitter:title" content="CREOVA — Ontario's BIPOC Creative Agency" />
    <meta name="twitter:description" content="Professional photography, videography, brand management, and event design for BIPOC communities across Canada." />
    <meta name="twitter:image" content="https://www.creova.one/card-blackprint.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Fonts. Display: Instrument Serif (Google) — expressive editorial serif.
      Body/UI: General Sans (Fontshare) — a crisp, geometric, restrained
      grotesque that gives the bespoke editorial-tech contrast we want, without
      the generic feel of a system sans.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
