<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        if (!sessionStorage.getItem('creova-intro-shown') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('creova-intro-pending');
          setTimeout(function () { document.documentElement.classList.remove('creova-intro-pending'); }, 2500);
        }
      } catch (_) {}
    </script>
    <style>
      html.creova-intro-pending,
      html.creova-intro-pending body { background: #2D1011; }
      html.creova-intro-pending #root { visibility: hidden; }
      html.creova-intro-pending [data-creova-intro] { visibility: visible; }
    </style>

    <!--
      Primary SEO: title/description/OG/Twitter here are a fallback ONLY for
      the brief pre-hydration window and for crawlers that don't execute JS
      (social unfurlers — Slack, Discord, iMessage). Every real route sets
      its own via the PageSEO component (src/components/PageSEO.tsx) once
      React mounts, using react-helmet-async.

      Deliberately NOT included here: robots and canonical. Those need a
      different, correct value per route (e.g. /admin/* is noindex), and
      react-helmet-async does not remove tags that were already in the
      static HTML — it only adds its own, so a static "index, follow" here
      would sit alongside a route's "noindex, nofollow" rather than being
      replaced by it. Omitting them means the only value ever present is
      the one PageSEO renders.
    -->
    <title>CREOVA — Cultural Storytelling Studio in Ontario</title>
    <meta name="description" content="CREOVA helps cultural, community, and purpose-led organizations turn meaningful events and programs into stories people can return to." />
    <meta name="keywords" content="cultural storytelling studio Ontario, event photography Niagara, community storytelling, videography, brand storytelling, CREOVA" />
    <meta name="author" content="CREOVA" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.creova.one/" />
    <meta property="og:title" content="CREOVA — Cultural Storytelling Studio in Ontario" />
    <meta property="og:description" content="Stories built with cultural and community organizations, from the room itself to the archive that remains." />
    <meta property="og:image" content="https://www.creova.one/card-blackprint.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="CREOVA" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@creova_ca" />
    <meta name="twitter:title" content="CREOVA — Cultural Storytelling Studio in Ontario" />
    <meta name="twitter:description" content="Stories built with cultural and community organizations, from the room itself to the archive that remains." />
    <meta name="twitter:image" content="https://www.creova.one/card-blackprint.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Brand typography prefers Quasimoda (Adobe Fonts / licensed self-hosting).
      General Sans and Instrument Serif remain verified web fallbacks until a
      CREOVA Adobe Fonts web-project kit is connected.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://images.pixieset.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
